services:
  - type: web
    name: hydra
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: hydra_db
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      # Reaproveita a conexao com o MySQL entre requisicoes. RECOMENDADO
      # "true": com o banco fora do Render, abrir uma conexao nova custa
      # varias idas e voltas pela rede em TODA chamada da API - e o maior
      # ganho de velocidade disponivel. Confira antes o limite de conexoes
      # do plano do banco (cada processo do Apache segura uma). Sem valor,
      # fica desligado.
      - key: DB_PERSISTENT
        sync: false
      # Front e API sao servidos pelo mesmo dominio neste servico, entao
      # nao ha requisicao cross-origin e a lista pode ficar vazia. Se o
      # front passar a ser hospedado separadamente, liste aqui a origem
      # dele - nunca "*", que em producao nao tem efeito de proposito.
      - key: CORS_ALLOWED_ORIGIN
        value: ""
      - key: APP_ENV
        value: production
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: APP_TIMEZONE_OFFSET
        value: "-03:00"
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Hydra PDV
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: WHATSAPP_API_VERSION
        value: v21.0
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TEMPLATE_RESUMO
        value: hydra_resumo_diario
      - key: WHATSAPP_TEMPLATE_IDIOMA
        value: pt_BR
      - key: ALERTAS_CRON_TOKEN
        sync: false
      - key: APP_URL
        value: https://hydra.onrender.com
