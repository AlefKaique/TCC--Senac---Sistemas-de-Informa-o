<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Hydra · Plataforma</title>
  <link rel="icon" type="image/png" href="../../img/logo-hydra.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/login.css">
</head>

<body class="signup-body">
  <main class="signup">
    <section class="signup__form-side">
      <div class="signup__form-wrap">
        <a href="../index.html" class="logo signup__logo">
          <img src="../../img/logo-hydra.png" alt="Hydra">
        </a>

        <p class="signup__hint">Hydra · Plataforma</p>

        <div id="step-login">
          <h1 class="signup__title">Acesso da plataforma</h1>
          <p class="signup__subtitle">Entre com a conta de administração da plataforma.</p>
          <p id="login-notice" class="signup__hint" role="status" hidden></p>
          <form class="signup__form login__form" id="login-form" novalidate>
            <div class="field">
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" autocomplete="username"
                placeholder="Digite seu e-mail" required>
            </div>
            <div class="field">
              <label for="senha">Senha</label>
              <input type="password" id="senha" name="senha" autocomplete="current-password"
                placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="btn btn--primary btn--block">Entrar</button>
          </form>
        </div>

        <div id="step-codigo" class="is-hidden">
          <h1 class="signup__title">Verificação em duas etapas</h1>
          <p class="signup__subtitle">
            Enviamos um código de 6 dígitos para <strong id="sent-to-email"></strong>.
          </p>
          <form class="signup__form login__form" id="codigo-form" novalidate>
            <div class="field">
              <label for="codigo">Código de verificação</label>
              <input type="text" id="codigo" name="codigo" inputmode="numeric"
                autocomplete="one-time-code" maxlength="6" placeholder="000000" required>
            </div>
            <button type="submit" class="btn btn--primary btn--block">Confirmar e entrar</button>
            <p class="signup__login">
              <button type="button" class="plataforma-link" id="reenviar-codigo">Reenviar código</button>
              · <button type="button" class="plataforma-link" id="voltar-login">Voltar</button>
            </p>
          </form>
        </div>
      </div>
    </section>

    <aside class="signup__promo">
      <div class="signup__promo-inner">
        <h2>Hydra · Plataforma</h2>
        <p>Área exclusiva de administração da plataforma.</p>
      </div>
    </aside>
  </main>
  <style>
    .plataforma-link {
      padding: 0;
      border: 0;
      background: none;
      color: var(--navy);
      font: inherit;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
  <script src="../../js/api.js"></script>
  <script src="../../js/plataforma-login.js"></script>
</body>

</html>
